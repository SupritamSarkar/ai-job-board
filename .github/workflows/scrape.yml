name: Daily Job Scraper

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Install Dependencies
        # ADDED selenium-stealth HERE
        run: |
          pip install selenium webdriver-manager selenium-stealth

      - name: Run Master Scraper
        run: python backend/master_all_scrapper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add frontend/src/jobs.json frontend/src/intern.json
          git diff --staged --quiet || (git commit -m "Auto-update jobs data" && git pull --rebase origin main && git push)