name: Daily Job Scraper

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 1. Install Google Chrome
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      # 2. Install Xvfb (Virtual Display)
      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      # 3. Install Python Dependencies
      - name: Install Dependencies
        run: |
          pip install selenium webdriver-manager

      # 4. Run Scraper with Virtual Display
      # xvfb-run --auto-servernum creates a fake screen so we can run Chrome WITHOUT 'headless' mode
      - name: Run Master Scraper
        run: xvfb-run --auto-servernum python backend/master_all_scrapper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add frontend/src/jobs.json frontend/src/intern.json
          git diff --staged --quiet || (git commit -m "Auto-update jobs data" && git pull --rebase origin main && git push)