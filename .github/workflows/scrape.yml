name: Daily Job Scraper

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install selenium pandas webdriver-manager

      # CRITICAL CHANGE HERE:
      # We tell python to run the file inside the 'backend' folder
      - name: Run Scraper
        run: python backend/naukri_exact.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # We add the file from the frontend folder
          git add frontend/src/jobs.json
          git commit -m "Auto-update jobs data" || echo "No changes to commit"
          git push