name: Daily Job Scraper

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install selenium pandas webdriver-manager

      # CRITICAL CHANGE HERE:
      # We tell python to run the file inside the 'backend' folder
      - name: Run Scraper
        run: python backend/naukri_exact.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. Add the file
          git add frontend/src/jobs.json
          
          # 2. Check for changes
          # If no changes, exit the script safely
          git diff --staged --quiet || (git commit -m "Auto-update jobs data" && git pull --rebase origin main && git push)
